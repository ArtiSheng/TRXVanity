name: TRXVanity

options:
  bundleIdPrefix: com.artisheng
  xcodeVersion: "16.0"
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/Vendor/secp256k1/include"
      - "$(SRCROOT)/Vendor/secp256k1/src"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      GCC_OPTIMIZATION_LEVEL: 3
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      CLANG_ENABLE_CODE_COVERAGE: NO

targets:
  TRXVanity:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: TRXVanity
        excludes:
          - Shaders
          - Vendor
          - Supporting/Info.plist
          - Supporting/TRXVanity.entitlements
      - path: TRXVanity/Shaders
        buildPhase: resources
      - path: Vendor/secp256k1/src/secp256k1.c
      - path: Vendor/secp256k1/src/precomputed_ecmult.c
      - path: Vendor/secp256k1/src/precomputed_ecmult_gen.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artisheng.trxvanity
        PRODUCT_NAME: TRX Vanity
        INFOPLIST_FILE: TRXVanity/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: TRXVanity/Supporting/TRXVanity.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: TRXVanity/Crypto/TRXVanity-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
  TRXVanityTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: TRXVanityTests
    dependencies:
      - target: TRXVanity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artisheng.trxvanity.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TRX Vanity.app/Contents/MacOS/TRX Vanity"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TRXVanity:
    build:
      targets:
        TRXVanity: all
        TRXVanityTests: [test]
    run:
      # The app is a compute workload: Xcode's Play button must not benchmark
      # the unoptimised Debug C/Swift code paths.
      config: Release
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TRXVanityTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
